<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/header.css">
    <link rel="stylesheet" href="../Css/main.css">
    <link rel="stylesheet" href="../Css/employee_form.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg nav-bar navbar-dark">
            <div class="container nav-bar-content d-flex align-items-lg-center">
                <a class="navbar-brand" href="#">
                    <p class="mt-2 text-white fw-bold">
                        Employees-Management
                    </p>
                </a>

                <button class="navbar-toggler border-white" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="offcanvas offcanvas-end offcanvas-custom-width bg-black  text-white" tabindex="-1"
                    id="mobileMenu">
                    <div class="offcanvas-header">
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
                    </div>
                    <div class="offcanvas-body py-3">
                        <ul class="navbar-nav ms-auto align-items-lg-center gap-1 fs-5">
                            <li class="nav-item ">
                                <a class="nav-link nav-text text-white custom-radius-50 "
                                    href="./employees_list.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-text text-white custom-radius-50" href="./add_employee.html">Add
                                    Employees</a>
                            </li>
                        </ul>
                        <div>
                            <a href="#">
                                <img alt="profile picture" src="../Assets/images/boy.png" height="40px" width="40px">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-4 page-title">
        <h1 class="mb-4 form-title text-center position-relative mt-3">Edit Employee Details</h1>

        <a href="../Html/employees_list.html">
            <button class="back-btn border-0 mb-5 position-relative" type="button">
                <div class="icon-box position-absolute top-0 start-0 d-flex align-items-center justify-content-center m-1 ">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" height="25" width="25">
                        <path d="M224 480h640a32 32 0 1 1 0 64H224a32 32 0 0 1 0-64z" fill="#000" />
                        <path
                            d="m237.248 512 265.408 265.344a32 32 0 0 1-45.312 45.312l-288-288a32 32 0 0 1 0-45.312l288-288a32 32 0 1 1 45.312 45.312L237.248 512z"
                            fill="#000" />
                    </svg>
                </div>
                <span class="btn-text">Back</span>
            </button>
        </a>

        <div class="form-wrap">
            <form class="employee-form d-flex flex-column needs-validation" id="editEmployeeForm" novalidate>
                <input type="hidden" name="employeeId" id="employeeId">
                <div class="row">
                    <div class="mb-3 col-6">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" name="name" id="name" class="form-control" required>
                        <div class="invalid-feedback">
                            Enter Employee name
                        </div>
                    </div>
                    <div class="mb-3 col-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" name="email" id="email" class="form-control" required>
                        <div class="invalid-feedback">
                            Enter Employee Email
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="mb-3 col-6">
                        <label for="department_id" class="form-label">Department</label>
                        <select id="department_id" class="form-select">
                            <option value="">All Departments</option>
                        </select>
                        <div class="invalid-feedback">
                            Select Employee Department
                        </div>
                    </div>
                    <div class="mb-3 col-6">
                        <label class="form-label">Employee Role</label>
                        <div class="dropdown" id="roleDropdownContainer">
                            <button
                                class="btn btn-outline-secondary dropdown-toggle w-100 text-start d-flex justify-content-between align-items-center"
                                type="button" id="roleDropdownBtn" data-bs-toggle="dropdown">
                                Select a role
                            </button>
                            <ul class="dropdown-menu w-100" id="roleDropdownMenu">
                                <!-- Roles with delete buttons will be here -->
                            </ul>
                            <div class="invalid-feedback">
                                Select Employee Role
                            </div>
                        </div>
                        <!-- Hidden input to store role_id for form submission -->
                        <input type="hidden" name="role_id" id="role_id" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Quick Add Role Section -->
                    <div class="card mb-3 bg-light border-0 col-6">
                        <div class="card-body d-flex align-items-center p-2">
                            <div class="input-group input-group-sm">
                                <input type="text" id="newRoleName" class="form-control" placeholder="Role Name">
                                <input type="number" id="newRoleSalary" class="form-control" style="width: 80px;"
                                    placeholder="Salary">
                                <button class="add-role-button d-flex align-items-center border-0 position-relative" type="button" id="saveRoleBtn">
                                    <span class="button_text text-white">Add Role</span>
                                    <span class="button_icon position-absolute d-flex align-items-center justify-content-center"><svg class="svg" fill="none" height="24"
                                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                            stroke-width="2" viewBox="0 0 24 24" width="24"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <line x1="12" x2="12" y1="5" y2="19"></line>
                                            <line x1="5" x2="19" y1="12" y2="12"></line>
                                        </svg></span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Edit Role Section
                    <div class="card mb-3 bg-light border-0 col-6">
                        <div class="card-body p-2">
                            <p class="small fw-semibold mb-1 text-muted">Edit Selected Role</p>
                            <div class="input-group input-group-sm">
                                <input type="text" id="editRoleName" class="form-control" placeholder="New Name">
                                <input type="number" id="editRoleSalary" class="form-control" style="width: 80px;"
                                    placeholder="New Salary">
                                <button class="add-role-button" type="button" id="saveRoleBtn">
                                    <span class="button_text">Update</span>
                                    <span class="button_icon"><svg class="svg" fill="none" height="24"
                                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                            stroke-width="2" viewBox="0 0 24 24" width="24"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <line x1="12" x2="12" y1="5" y2="19"></line>
                                            <line x1="5" x2="19" y1="12" y2="12"></line>
                                        </svg></span>
                                </button>
                            </div>
                        </div>
                    </div> -->
                </div>

                <div class="row">
                    <div class="mb-3 col-6">
                        <label for="salary_display" class="form-label">Current Role Salary</label>
                        <input type="text" id="salary_display" class="form-control" disabled
                            placeholder="Select a role above">
                    </div>
                </div>

                <div class="row">
                    <div class="mb-3 col-6">
                        <label for="joining_date" class="form-label">Joining Date</label>
                        <input type="date" name="joining_date" id="joining_date" class="form-control" required>
                        <div class="invalid-feedback">
                            Enter Employee Joining date
                        </div>
                    </div>
                    <div class="mb-3 col-6">
                        <label for="status" class="form-label">Status</label>
                        <select name="status" id="status" class="form-select" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                        <div class="invalid-feedback">
                            Select Employee Status
                        </div>
                    </div>
                </div>

                <div>
                    <button class="button submit-btn d-flex align-items-center border-0 ">
                        <div class="svg-wrapper-1 text-white">
                            <div class="svg-wrapper">
                                <svg class="d-block " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24"
                                    height="24">
                                    <path fill="none" d="M0 0h24v24H0z"></path>
                                    <path fill="currentColor"
                                        d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z">
                                    </path>
                                </svg>
                            </div>
                        </div>
                        <span class="text-white d-block">Submit</span>
                    </button>
                </div>


            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/shared_employee.js"></script>
    <script src="../JavaScript/edit_employee.js"></script>
</body>

</html>
