<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/header.css">
    <link rel="stylesheet" href="../Css/main.css">
    <link rel="stylesheet" href="../Css/employee_form.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg nav-bar navbar-dark">
            <div class="container nav-bar-content d-flex align-items-lg-center">
                <a class="navbar-brand" href="#">
                    <p class="mt-2 text-white fw-bold">
                        Employees-Management
                    </p>
                </a>

                <button class="navbar-toggler border-white" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="offcanvas offcanvas-end offcanvas-custom-width bg-black  text-white" tabindex="-1"
                    id="mobileMenu">
                    <div class="offcanvas-header">
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
                    </div>
                    <div class="offcanvas-body py-3">
                        <ul class="navbar-nav ms-auto align-items-lg-center gap-1 fs-5">
                            <li class="nav-item ">
                                <a class="nav-link nav-text text-white custom-radius-50"
                                    href="./employees_list.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-text text-white custom-radius-50" href="./add_employee.html">Add
                                    Employees</a>
                            </li>
                        </ul>
                        <div>
                            <a href="#">
                                <img alt="profile picture" src="../Assets/images/boy.png" height="40px" width="40px">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-4">
        <h1 class="mb-4 form-title">Edit Employee Details</h1>

        <button class="back-button" href="./employees_list.html">
            <svg height="16" width="16" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1024 1024">
                <path
                    d="M874.690416 495.52477c0 11.2973-9.168824 20.466124-20.466124 20.466124l-604.773963 0 188.083679 188.083679c7.992021 7.992021 7.992021 20.947078 0 28.939099-4.001127 3.990894-9.240455 5.996574-14.46955 5.996574-5.239328 0-10.478655-1.995447-14.479783-5.996574l-223.00912-223.00912c-3.837398-3.837398-5.996574-9.046027-5.996574-14.46955 0-5.433756 2.159176-10.632151 5.996574-14.46955l223.019353-223.029586c7.992021-7.992021 20.957311-7.992021 28.949332 0 7.992021 8.002254 7.992021 20.957311 0 28.949332l-188.073446 188.073446 604.753497 0C865.521592 475.058646 874.690416 484.217237 874.690416 495.52477z">
                </path>
            </svg>
            <span>Back</span>
        </button>

        <div class="form-wrap">
            <form class="product-form" id="editEmployeeForm">
                <input type="hidden" name="employeeId" id="employeeId">
                <div class="row">
                    <div class="mb-3 col-6">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" name="name" id="name" class="form-control" required>
                    </div>
                    <div class="mb-3 col-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" name="email" id="email" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <div class="mb-3 col-6">
                        <label for="department_id" class="form-label">Department</label>
                        <select id="department_id" class="form-select">
                            <option value="">All Departments</option>
                        </select>
                    </div>
                    <div class="mb-3 col-6">
                        <label class="form-label">Employee Role</label>
                        <div class="dropdown" id="roleDropdownContainer">
                            <button
                                class="btn btn-outline-secondary dropdown-toggle w-100 text-start d-flex justify-content-between align-items-center"
                                type="button" id="roleDropdownBtn" data-bs-toggle="dropdown">
                                Select a role
                            </button>
                            <ul class="dropdown-menu w-100" id="roleDropdownMenu">
                                <!-- Roles with delete buttons will be here -->
                            </ul>
                        </div>
                        <!-- Hidden input to store role_id for form submission -->
                        <input type="hidden" name="role_id" id="role_id" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Quick Add Role Section -->
                    <div class="card mb-3 bg-light border-0 col-6">
                        <div class="card-body p-2">
                            <div class="input-group input-group-sm">
                                <input type="text" id="newRoleName" class="form-control" placeholder="New Role Name">
                                <input type="number" id="newRoleSalary" class="form-control" style="width: 80px;"
                                    placeholder="Salary">
                                <button type="button" class="btn btn-primary" id="saveRoleBtn">Add Role</button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3 col-6">
                        <label for="salary_display" class="form-label">Current Role Salary</label>
                        <input type="text" id="salary_display" class="form-control" disabled
                            placeholder="Select a role above">
                    </div>
                </div>

                <div class="row">
                    <div class="mb-3 col-6">
                        <label for="joining_date" class="form-label">Joining Date</label>
                        <input type="date" name="joining_date" id="joining_date" class="form-control" required>
                    </div>
                    <div class="mb-3 col-6">
                        <label for="status" class="form-label">Status</label>
                        <select name="status" id="status" class="form-select" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </div>


                <button class="btn btn-primary" type="submit">Update Employee</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/edit_employee.js"></script>
</body>

</html>
