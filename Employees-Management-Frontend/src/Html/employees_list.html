<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../Css/header.css">
    <link rel="stylesheet" href="../Css/main.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg nav-bar navbar-dark">
            <div class="container nav-bar-content d-flex align-items-lg-center">
                <a class="navbar-brand" href="#">
                    <p class="mt-2 text-white">
                        Employees-Management
                    </p>
                </a>

                <button class="navbar-toggler border-white" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="offcanvas offcanvas-end offcanvas-custom-width bg-black  text-white" tabindex="-1"
                    id="mobileMenu">
                    <div class="offcanvas-header">
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
                    </div>
                    <div class="offcanvas-body py-3">
                        <ul class="navbar-nav ms-auto align-items-lg-center gap-1 fs-5">
                            <li class="nav-item ">
                                <a class="nav-link nav-text text-white custom-radius-50 active"
                                    href="./employees_list.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-text text-white custom-radius-50" href="./add_employee.html">Add
                                    Employees</a>
                            </li>
                        </ul>
                        <div>
                            <a href="#">
                                <img alt="profile picture" src="../Assets/images/boy.png" height="40px" width="40px">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center">
            <h2 class="py-3">Welcome to Employees details page.</h2>
            <a href="add_employee.html" class="text-white btn d-flex flex-wrap justify-content-end bg-primary">Add
                Employee</a>
        </div>
        <div class="filter-section-wrapper d-flex flex-wrap justify-content-start gap-2 align-items-center mb-5 mt-4 ">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search by Name, Email, and Role" class="search-input">
            </div>
            <div class="dropdown department-dropdown">
                <button class="btn  dropdown-toggle department-dropdown-button" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Department
                </button>
                <ul class="dropdown-menu" id="getEmpDepartment"></ul>
            </div>

            <div class="dropdown status-dropdown">
                <button class="btn  dropdown-toggle status-dropdown-button" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    status
                </button>
                <ul class="dropdown-menu" id="getEmpStatus">
                </ul>
            </div>

            <div class="input-group min-max-inputs">
                <input type="text" id="minInput" placeholder="Min" class=" min-input">
                <input type="text" id="maxInput" placeholder="Max" class="max-input">
            </div>

        </div>

        <div class="table-responsive custom-table-wrapper">
            <table class="table table-hover align-middle table-borderless" id="sorting">
                <thead class="table-header-color">
                    <tr>
                        <th>Emp_Id</th>
                        <th class="ps-4">Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th onclick="sortTable(5)" class="cursor-pointer">
                            <div class="d-flex align-items-center gap-2">
                                Salary
                                <span id="sortIcon" class="sort-icon-container">
                                    <i id="sortIconI" class="bi bi-arrow-down-up"></i>
                                </span>
                            </div>
                        </th>
                        <th>Status</th>
                        <th class="text-center pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                </tbody>
            </table>
            <h3 id="noEmployeesMessage" class="text-center text-muted py-5">No Employees Found!</h3>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/employee_list.js"></script>
</body>

</html>
