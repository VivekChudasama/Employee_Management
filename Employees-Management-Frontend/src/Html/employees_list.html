<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../Css/navbar.css">
    <link rel="stylesheet" href="../Css/main.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg nav-bar navbar-dark top-0 position-sticky">
            <div class="container nav-bar-content d-flex align-items-lg-center">
                <a class="navbar-brand" href="#">
                    <p class="mt-2 text-white fw-bold">Employees-Management</p>
                </a>

                <button title="toggle-btn" class="navbar-toggler border-white" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="offcanvas offcanvas-end offcanvas-custom-width bg-black text-white" tabindex="-1"
                    id="mobileMenu">
                    <div class="offcanvas-header">
                        <button title="blose-btn" type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
                    </div>
                    <div class="offcanvas-body py-3">
                        <ul class="navbar-nav ms-auto align-items-lg-center gap-1 fs-5">
                            <li class="nav-item">
                                <a class="nav-link nav-text d-inline-block align-middle text-white pill-radius active"
                                    href="./employees_list.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-text text-white pill-radius" href="./add_employee.html">Add
                                    Employees</a>
                            </li>
                        </ul>
                        <div class="nav-profile-wrap">
                            <a href="#">
                                <img alt="profile picture" src="../Assets/images/pofile-image.png" height="40px" width="40px">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container add-employee mt-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center">
            <h2 class="py-3">Welcome to Employees details page.</h2>
            <a href="add_employee.html" class="btn bg-primary text-white add-emp-btn">Add Employee</a>
        </div>

        <div class="filter-bar d-flex flex-wrap justify-content-start gap-2 align-items-center mb-5 mt-4">
            <div class="filter-bar-search">
                <input type="text" id="searchInput" placeholder="Search by Name, Email, and Role" class="search-input">
            </div>

            <div class="dropdown filter-bar-dropdown">
                <button class="btn dropdown-toggle dropdown-btn" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Department
                </button>
                <ul class="dropdown-menu" id="getEmpDepartment"></ul>
            </div>

            <div class="dropdown filter-bar-dropdown">
                <button class="btn dropdown-toggle dropdown-btn status-dropdown-btn " type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Status
                </button>
                <ul class="dropdown-menu" id="getEmpStatus"></ul>
            </div>

            <div class="d-flex filter-bar-range gap-1">
                <input type="text" id="minInput" placeholder="Min" class="range-input">
                <input type="text" id="maxInput" placeholder="Max" class="range-input">
            </div>
        </div>

        <div class="emp-table overflow-x-auto">
            <table class="table table-hover align-middle table-borderless emp-table-table mb-0" id="sorting">
                <thead class="emp-table-head ">
                    <tr>
                        <th class="emp-table-th border-0">Emp_Id</th>
                        <th class="emp-table-th border-0 ps-4">Name</th>
                        <th class="emp-table-th border-0">Email</th>
                        <th class="emp-table-th border-0">Department</th>
                        <th class="emp-table-th border-0">Role</th>
                        <th class="emp-table-th border-0 click-pointer" onclick="sortTable(5)">
                            <div class="d-flex align-items-center gap-2">
                                Salary
                                <span id="sortIcon" class="sort-icon-box d-inline-flex align-items-center justify-content-center">
                                    <i id="sortIconI" class="bi bi-arrow-down-up sort-arrow"></i>
                                </span>
                            </div>
                        </th>
                        <th class="emp-table-th click-pointer text-nowrap text-center" onclick="sortTable(6)">
                            <div class="d-flex align-items-center justify-content-center gap-2">
                                Joining Date
                                <span id="sortDateIcon" class="sort-icon-box d-inline-flex align-items-center justify-content-center">
                                    <i id="sortDateIconI" class="bi bi-arrow-down-up sort-arrow"></i>
                                </span>
                            </div>
                        </th>
                        <th class="emp-table-th">Status</th>
                        <th class="emp-table-th text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody" class="emp-table-body"></tbody>
            </table>
            <h3 id="noEmployeesMessage" class="text-center text-muted py-5 d-none">
                No Employees Found!
            </h3>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../JavaScript/employee_list.js"></script>

</html>
