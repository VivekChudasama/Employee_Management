<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/header.css">
    <link rel="stylesheet" href="../Css/main.css">
</head>

<body>
    <header">
        <nav class="navbar navbar-expand-lg nav-bar py-1 px-5 py-sm-0 px-sm-0">
            <div class="container nav-bar-content d-flex align-items-lg-center">
                <a class="navbar-brand" href="#">
                    <p class="mt-2 text-white fw-bold">
                        Employees-Management
                    </p>
                </a>

                <button  class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="offcanvas offcanvas-end offcanvas-custom-width " tabindex="-1" id="mobileMenu">
                    <div class="offcanvas-header">
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                    </div>
                    <div class="offcanvas-body py-3">
                        <ul class="navbar-nav ms-auto align-items-lg-center gap-1 fs-5">
                            <li class="nav-item ">
                                <a class="nav-link nav-text text-white custom-radius-50 active"
                                    href="./employees_list.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-text text-white custom-radius-50" href="./add_employee.html">Add
                                    Employees</a>
                            </li>
                            </li>
                        </ul>
                        <div>
                            <a href="#">
                                <img src="../Assets/images/boy.png" height="40px" width="40px">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-4">
            <h2 class="py-3">Welcome to Employees details page.</h2>
            <a href="add_employee.html" class="text-white btn d-flex flex-wrap justify-content-end bg-primary">Add
                Employee</a>
        </div>
        <div class="d-flex flex-wrap gap-4 align-items-center mb-5">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search by Name, Email, or Role..."
                    class="search-input">
            </div>
            <div class="dropdown border">
                <button class="btn  dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Dropdown button
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Action</a></li>
                    <li><a class="dropdown-item" href="#">Another action</a></li>
                    <li><a class="dropdown-item" href="#">Something else here</a></li>
                </ul>
            </div>

            <div class="dropdown border">
                <button class="btn  dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    status
                </button>
                <ul  class="dropdown-menu"  id="getEmpStatus">
                </ul>
            </div>

            <div class="input-group">
                <input type="text" id="minInput" placeholder="Min" class=" Min-input">
                <input type="text" id="maxInput" placeholder="Max" class="Max-input">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered" id="sorting">
                <thead class="table-secondary table-header-color">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                </tbody>
            </table>
            <h1 id="noEmployeesMessage">No Employees Found!</h1>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/employee_list.js"></script>
</body>

</html>
