<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees List</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <!-- bootstrap cdn link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- bootstrap icon cdn link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- import all the required css files -->
    <link rel="stylesheet" href="../Css/navbar.css">
    <link rel="stylesheet" href="../Css/main.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg nav-bar navbar-dark top-0 position-sticky">
            <div class="container nav-bar-content d-flex align-items-lg-center">
                <a class="navbar-brand" href="#">
                    <p class="mt-2 text-white fw-bold">Employees-Management</p>
                </a>

                <button title="toggle-btn" class="navbar-toggler border-white" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="offcanvas offcanvas-end offcanvas-custom-width bg-black text-white" tabindex="-1"
                    id="mobileMenu">
                    <div class="offcanvas-header">
                        <button title="blose-btn" type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="offcanvas"></button>
                    </div>
                    <div class="offcanvas-body py-3">
                        <ul class="navbar-nav ms-auto align-items-lg-center gap-1 fs-5">
                            <li class="nav-item">
                                <a class="nav-link nav-text d-inline-block align-middle text-white pill-radius active"
                                    href="./employees_list.html">Employees</a>
                            </li>
                        </ul>
                        <div class="nav-profile-wrap ms-4">
                            <a href="#">
                                <img alt="profile picture" src="../Assets/images/profile-image.png" loading="eager"
                                    height="40px" width="40px">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container add-employee mt-4">

        <!-- search and all the filters -->
        <div class="filter-bar d-flex flex-wrap align-items-center gap-3 mb-5 mt-4">
            <!-- Search -->
            <div class="filter-bar-search order-2 order-lg-1">
                <input type="text" id="searchInput" placeholder="Search by Name, Email, and Role" class="search-input">
            </div>

            <!-- Filters Container -->
            <div class="filters-container d-flex flex-wrap  gap-3 order-3 order-lg-2">
                <!-- Department -->
                <div class="dropdown filter-bar-dropdown">
                    <button class="btn dropdown-toggle dropdown-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Department
                    </button>
                    <ul class="dropdown-menu" id="getEmpDepartment"></ul>
                </div>

                <!-- Status -->
                <div class="dropdown filter-bar-dropdown">
                    <button class="btn dropdown-toggle dropdown-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Status
                    </button>
                    <ul class="dropdown-menu" id="getEmpStatus"></ul>
                </div>

                <!-- Salary Range -->
                <div class="d-flex gap-2 min-max-filter">
                    <div class="position-relative filter-bar-range">
                        <input type="number" id="min_salary" placeholder="Min Salary" class="range-input salary-input" min="0">
                    </div>
                    <div class="position-relative filter-bar-range">
                        <input type="number" id="max_salary" placeholder="Max Salary" class="range-input salary-input" min="0">
                    </div>
                </div>
            </div>

            <!-- Add Employee Button -->
            <div class="add-emp-btn-container w-md-auto text-end order-1 order-lg-3">
                <a href="add_employee.html" class="btn btn-custom-primary text-white add-emp-btn text-nowrap">Add Employee</a>
            </div>
        </div>

        <!-- employee list in table -->
        <div class="emp-table overflow-x-auto mb-3">
            <table class="table table-hover align-middle table-borderless emp-table-table mb-0" id="sorting">
                <thead class="emp-table-head ">
                    <tr>
                        <th class="emp-table-th border-0 ps-4">Name</th>
                        <th class="emp-table-th border-0">Email</th>
                        <th class="emp-table-th border-0">Department</th>
                        <th class="emp-table-th border-0">Role</th>
                        <th class="emp-table-th border-0 click-pointer" onclick="sortTable(4)">
                            <div class="d-flex align-items-center gap-2">
                                Salary
                                <span id="sortIcon"
                                    class="sort-icon-box d-inline-flex align-items-center justify-content-center">
                                    <i id="sortIconI" class="bi bi-arrow-down-up sort-arrow"></i>
                                </span>
                            </div>
                        </th>
                        <th class="emp-table-th click-pointer text-nowrap text-center" onclick="sortTable(5)">
                            <div class="d-flex align-items-center justify-content-center gap-2">
                                Joining Date
                                <span id="sortDateIcon"
                                    class="sort-icon-box d-inline-flex align-items-center justify-content-center">
                                    <i id="sortDateIconI" class="bi bi-arrow-down-up sort-arrow"></i>
                                </span>
                            </div>
                        </th>
                        <th class="emp-table-th">Status</th>
                        <th class="emp-table-th text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody" class="emp-table-body"></tbody>
            </table>
            <h3 id="noEmployeesMessage" class="text-center text-muted py-5 d-none">
                No Employees Found!
            </h3>
        </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm custom-modal-width custom-modal-sm-width">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-4">
                    <div class="mb-3">
                        <i id="confirmIcon" class="bi bi-exclamation-circle text-warning font-large"></i>
                    </div>
                    <h5 id="confirmTitle" class="mb-2">Are you sure?</h5>
                    <p id="confirmMessage" class="text-muted mb-0 small">This action cannot be undone.</p>
                </div>
                <div class="modal-footer border-0 justify-content-center pb-4">
                    <button type="button" class="btn btn-light px-4 rounded-pill" data-bs-dismiss="modal">No</button>
                    <button type="button" class="btn btn-danger px-4 rounded-pill" id="confirmActionBtn">Yes</button>
                </div>
            </div>
        </div>
    </div>
    <!-- import all the required JavaScript files -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/validation.js"></script>
    <script src="../JavaScript/employee_data.js"></script>
    <script src="../JavaScript/employee_list.js"></script>
</body>

</html>
