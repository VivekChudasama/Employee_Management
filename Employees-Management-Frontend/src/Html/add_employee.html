<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <!-- bootstrap cdn link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- import all the required css files -->
    <link rel="stylesheet" href="../Css/navbar.css">
    <link rel="stylesheet" href="../Css/main.css">
    <link rel="stylesheet" href="../Css/employee_form.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg nav-bar navbar-dark top-0 position-sticky">
            <div class="container nav-bar-content d-flex align-items-lg-center">
                <a class="navbar-brand" href="#">
                    <p class="mt-2 text-white fw-bold">Employees-Management</p>
                </a>

                <button title="toggle-btn" class="navbar-toggler border-white" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="offcanvas offcanvas-end offcanvas-custom-width bg-black text-white" tabindex="-1"
                    id="mobileMenu">
                    <div class="offcanvas-header">
                        <button title="close-btn" type="button" class="btn-close btn-close-white"
                            data-bs-dismiss="offcanvas"></button>
                    </div>
                    <div class="offcanvas-body py-3">
                        <ul class="navbar-nav ms-auto align-items-lg-center gap-1 fs-5">
                            <li class="nav-item">
                                <a class="nav-link nav-text d-inline-block align-middle text-white pill-radius"
                                    href="./employees_list.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-text text-white pill-radius active"
                                    href="./add_employee.html">Add
                                    Employees</a>
                            </li>
                        </ul>
                        <div class="nav-profile-wrap ms-4">
                            <a href="#">
                                <img alt="profile picture" src="../Assets/images/pofile-image.png" height="40px"
                                    width="40px">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container form mt-4">
        <h1 class="mb-4 form-title text-center position-relative mt-3">Add Employee Details</h1>

        <a href="../Html/employees_list.html">
            <button class="back-btn mb-4 mt-3 border-0 position-relative" type="button">
                <div class="back-icon-box position-absolute top-0 start-0 d-flex
                    align-items-center justify-content-center m-1">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" height="25" width="25">
                        <path d="M224 480h640a32 32 0 1 1 0 64H224a32 32 0 0 1 0-64z" fill="#000" />
                        <path d="m237.248 512 265.408 265.344a32 32 0 0 1-45.312 45.312l-288-288a32
                            32 0 0 1 0-45.312l288-288a32 32 0 1 1 45.312 45.312L237.248 512z" fill="#000" />
                    </svg>
                </div>
                <span class="back-label">Back</span>
            </button>
        </a>

        <div class="form-body">
            <form class="employee-form needs-validation" id="addEmployeeForm" novalidate>

                <!-- Row 1: Name + Email -->
                <div class="row form-row">
                    <div class="mb-3 col-12 col-md-6">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" name="name" placeholder="Enter your Name" id="name" class="form-control"
                            minlength="3" maxlength="50" pattern="^[a-zA-Z\s.]+$" required>
                        <div class="invalid-feedback">Enter a valid name (letters, spaces, dots only)</div>
                    </div>
                    <div class="mb-3 col-12 col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" name="email" placeholder="Enter your Email" id="email" class="form-control"
                            maxlength="254" required>
                        <div class="invalid-feedback">Enter a valid email address</div>
                    </div>
                </div>

                <!-- Row 2: Department + Role -->
                <div class="row form-row">
                    <div class="mb-3 col-12 col-md-6">
                        <label for="department_id" class="form-label">Department</label>
                        <select id="department_id" class="form-select">
                        </select>
                    </div>
                    <div class="mb-3 col-12 col-md-6">
                        <label class="form-label">Employee Role</label>
                        <button class="btn outline-input-btn dropdown-toggle w-100 text-start
                            d-flex justify-content-between align-items-center role-dropdown-btn" type="button"
                            id="roleDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false">
                            Select a role
                        </button>
                        <ul class="dropdown-menu w-auto" id="roleDropdownMenu"></ul>
                        <input type="hidden" name="role_id" id="role_id">
                    </div>
                </div>

                <!-- Row 3: Salary -->
                <div class="row form-row">
                    <div class="mb-3 col-12">
                        <label for="salary_display" class="form-label">Current Role Salary</label>
                        <input type="text" id="salary_display" class="form-control" disabled
                            placeholder="Select a role above">
                    </div>
                </div>


                <!-- Row 4: Joining Date + Status -->
                <div class="row form-row">
                    <div class="mb-3 col-12 col-md-6">
                        <label for="joining_date" class="form-label">Joining Date</label>
                        <input type="date" name="joining_date" id="joining_date" class="form-control" min="2026-01-02"
                            required>
                        <div class="invalid-feedback">Joining date must be after 2026-01-01</div>
                    </div>
                    <div class="mb-3 col-12 col-md-6">
                        <label for="status" class="form-label">Status</label>
                        <select name="status" id="status" class="form-select" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                        <div class="invalid-feedback">Select Employee Status</div>
                    </div>
                </div>

                <!-- Submit -->
                <div class="submit-section d-flex justify-content-center mt-3 mb-3">
                    <button class="send-btn overflow-hidden d-flex align-items-center border-0" type="submit" disabled id="submitBtn">
                        <div class="svg-wrapper-1 text-white">
                            <div class="send-btn-wrapper">
                                <svg class="send-btn-icon d-block" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24" width="24" height="24">
                                    <path fill="none" d="M0 0h24v24H0z"></path>
                                    <path fill="currentColor"
                                        d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z">
                                    </path>
                                </svg>
                            </div>
                        </div>
                        <span class="text-white d-block send-btn-label">Submit</span>
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Role Modal -->
    <div class="modal fade" id="roleModal" tabindex="-1" aria-labelledby="roleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white border-0">
                    <h5 class="modal-title" id="roleModalLabel">Manage Role</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="newRoleName" class="form-label">Role Name</label>
                        <input type="text" id="newRoleName" class="form-control" placeholder="Enter role name" minlength="3" maxlength="30">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="newRoleSalary" class="form-label">Salary</label>
                        <input type="number" id="newRoleSalary" class="form-control" placeholder="Enter salary" min="1">
                        <div class="invalid-feedback"></div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary px-4 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary px-4 rounded-pill" id="saveRoleBtn">Save Role</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-4">
                    <div class="mb-3">
                        <i id="confirmIcon" class="bi bi-exclamation-circle text-warning font-large"></i>
                    </div>
                    <h5 id="confirmTitle" class="mb-2">Are you sure?</h5>
                    <p id="confirmMessage" class="text-muted mb-0 small">This action cannot be undone.</p>
                </div>
                <div class="modal-footer border-0 justify-content-center pb-4">
                    <button type="button" class="btn btn-light px-4 rounded-pill" data-bs-dismiss="modal">No</button>
                    <button type="button" class="btn btn-danger px-4 rounded-pill" id="confirmActionBtn">Yes</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/validation.js"></script>
    <script src="../JavaScript/shared_employee.js"></script>
    <script src="../JavaScript/add_employee.js"></script>
</body>

</html>
